<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .label {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 22px;
        fill: #111;
      }
      .num-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #111;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .center-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 32px;
        font-weight: 600;
        fill: #111;
        text-anchor: middle;
      }
      .logo-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 24px;
        font-weight: 700;
        fill: #111;
      }
    </style>
    
    <!-- Base Chevron Segment Path -->
    <path id="segment" d="M 128.0 -22.57 L 160 0 L 187.1 -32.99 A 190 190 0 0 1 122.1 145.5 L 80 138.56 L 83.56 99.58 A 130 130 0 0 0 128.0 22.57 Z" stroke="white" stroke-width="5" stroke-linejoin="round" />
  </defs>

  <!-- Circular Arrows Group -->
  <g transform="translate(400, 300)">
    <use href="#segment" fill="#F4B856" transform="rotate(-90)" />
    <use href="#segment" fill="#E68A6E" transform="rotate(-30)" />
    <use href="#segment" fill="#EF6461" transform="rotate(30)" />
    <use href="#segment" fill="#8F7EE5" transform="rotate(90)" />
    <use href="#segment" fill="#4C72D6" transform="rotate(150)" />
    <use href="#segment" fill="#5B9F71" transform="rotate(210)" />
  </g>

  <!-- <text x="400" y="285" class="center-text">Méthodologie</text>
  <text x="400" y="325" class="center-text">agile</text> -->

  <g>
    <circle cx="530" cy="120" r="16" fill="none" stroke="#111" stroke-width="2" />
    <text x="530" y="120" class="num-text">1</text>
    <text x="555" y="127" class="label">Planifier</text>

    <circle cx="620" cy="300" r="16" fill="none" stroke="#111" stroke-width="2" />
    <text x="620" y="300" class="num-text">2</text>
    <text x="645" y="307" class="label">Concevoir</text>

    <circle cx="530" cy="480" r="16" fill="none" stroke="#111" stroke-width="2" />
    <text x="530" y="480" class="num-text">3</text>
    <text x="555" y="487" class="label">Développer</text>

    <circle cx="270" cy="480" r="16" fill="none" stroke="#111" stroke-width="2" />
    <text x="270" y="480" class="num-text">4</text>
    <text x="245" y="487" class="label" text-anchor="end">Tester</text>

    <circle cx="190" cy="300" r="16" fill="none" stroke="#111" stroke-width="2" />
    <text x="190" y="300" class="num-text">5</text>
    <text x="165" y="307" class="label" text-anchor="end">Déployer</text>

    <circle cx="270" cy="120" r="16" fill="none" stroke="#111" stroke-width="2" />
    <text x="270" y="120" class="num-text">6</text>
    <text x="245" y="127" class="label" text-anchor="end">Réviser</text>
  </g>
</svg>
